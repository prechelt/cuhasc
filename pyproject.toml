[project]
name = "cuhasc"
version = "0.6.0"
description = "Culture Handbook for Scrum and Agile: determine a team's culture profile and the agile process execution problems likely to result from it (webapp)"
authors = [{name = "Lutz Prechelt", email = "prechelt@inf.fu-berlin.de"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=6.0,<7.0",
    "django-crispy-forms>=2.3,<3.0",
    "crispy-bootstrap5>=2024.10",
    "markdown>=3.10,<4.0",
    "pyyaml>=6.0.3,<7.0",
    "waitress>=3.0,<4.0",     # the HTTP server; pure Python, no dependencies, works on Windows too
    "whitenoise>=6.12,<7.0",  # serves the static files once DEBUG is off; pure Python, no dependencies
]

[project.urls]
Homepage = "https://github.com/prechelt/cuhasc"
Repository = "https://github.com/prechelt/cuhasc"

[project.scripts]
cuhasc = "cuhasc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-django>=4.12,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cuhasc"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cuhasc.settings"
