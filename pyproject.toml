[tool.poetry]
name = "cuhasc"
version = "0.5.0"
# Poetry requires a single-line description; the long text is taken from README.md.
description = "Culture Handbook for Scrum and Agile: determine a team's culture profile and the agile process execution problems likely to result from it"
authors = ["Lutz Prechelt <prechelt@inf.fu-berlin.de>"]
license = "MIT"
readme = "README.md"
packages = [{include = "cuhasc"}]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0"
django-crispy-forms = "^2.3"
crispy-bootstrap5 = ">=2024.10"
markdown = "^3.10"
pyyaml = "^6.0.3"
whitenoise = "^6.12"  # serves the static files once DEBUG is off; pure Python, no dependencies

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1"
pytest-django = "^4.12"
playwright = "^1.61.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cuhasc.settings"
