{% extends "cuhasc/base.html" %}

{% block title %}Edit Team "{"{ team.name }}{% endblock %}

{% block content %}
<h1>Edit Team "{{ team.name }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
<hr>
<p>Share this link with your team members to join:</p>
<a href="{% url 'create_member' team.id team.member_token %}">{% url 'create_member' team.id team.member_token %}</a>
{% endblock %}
