{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
      mq.addEventListener('change', e => document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light'));
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}cuhasc{% endblock %}</title>
    <link rel="icon" href="{% static 'cuhasc/favicon.png' %}">
    <link href="{% static 'cuhasc/vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'cuhasc/cuhasc.css' %}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="page-header">
        {{ breadcrumb }}
        <a href="{% url 'home' %}" aria-label="CuHaSc home">
            <img src="{% static 'cuhasc/cuhasc-logo.svg' %}" alt="CuHaSc" class="page-logo">
        </a>
    </div>
    {% block content %}{% endblock %}
</div>
<script src="{% static 'cuhasc/vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
